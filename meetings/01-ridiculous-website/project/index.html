<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>Team Product Lab</title>
    <link rel="stylesheet" href="style.css">
  </head>
  <body>
    <main class="demo-shell">
      <p class="tag">Team project · remix this page</p>
      <section class="product-card">
        <!-- BUILD LAB EDIT 1: Change this product name and slogan. -->
        <h1>Rock Royale</h1>
        <p class="lede">The ordinary rock that is ready to become your most important possession.</p>
        <!-- BUILD LAB EDIT 2: Change the image and alt text together. -->
        <img src="../../../shared/assets/rock.svg" alt="A dramatically lit ordinary rock">
        <div class="price-row">
          <!-- BUILD LAB EDIT 3: Change the price and review. -->
          <p class="price">$499.99</p>
          <p class="small-note">★★★★★ · “It sat there exactly as promised.”</p>
        </div>
        <div class="button-row">
          <button id="buy-button" type="button">Buy this rock</button>
          <!-- BOSS LEVEL: make this reveal a new fact. -->
          <button id="surprise-button" class="secondary" type="button">Reveal a secret</button>
        </div>
        <p id="surprise-message" class="message" hidden>Secret fact: this rock has never lost an argument.</p>
      </section>
    </main>
    <script src="../../../shared/club-kit.js"></script>
    <script src="script.js"></script>
  </body>
</html>
