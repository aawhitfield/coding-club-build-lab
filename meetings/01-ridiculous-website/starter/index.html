<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Rock Royale</title>
  <link rel="stylesheet" href="style.css">
</head>
<body>
  <main class="demo-shell">
    <p class="tag">Limited edition · probably</p>
    <section class="product-card">
      <!-- REMIX: Change the product name and slogan. -->
      <h1>Rock Royale</h1>
      <p class="lede">The ordinary rock that is ready to become your most important possession.</p>
      <!-- REMIX: Change the image alt text when you change the product. -->
      <img src="../../../shared/assets/rock.svg" alt="A dramatically lit ordinary rock">
      <div class="price-row">
        <!-- REMIX: Change the price and review. -->
        <p class="price">$499.99</p>
        <p class="small-note">★★★★★ · “It sat there exactly as promised.”</p>
      </div>
      <div class="button-row">
        <button id="buy-button" type="button">Buy this rock</button>
        <!-- BOSS LEVEL: make this button reveal a new ridiculous fact. -->
        <button id="surprise-button" class="secondary" type="button">Reveal a secret</button>
      </div>
      <p id="surprise-message" class="message" hidden>Secret fact: this rock has never lost an argument.</p>
    </section>
  </main>
  <script src="../../../shared/club-kit.js"></script>
  <script src="script.js"></script>
</body>
</html>
