<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>The Chaos Button Starter</title>
    <link rel="stylesheet" href="style.css">
  </head>
  <body>
    <main class="machine-shell">
      <section class="machine-card">
        <header class="machine-header">
          <p class="eyebrow">Meeting 3 · starter</p>
          <!-- BUILD LAB EDIT 1: change the machine name and the instruction. -->
          <h1>The Chaos Button</h1>
          <p class="instructions">Press the button and let two tiny lists invent your next questionable plan.</p>
        </header>
        <!-- BUILD LAB EDIT 2: replace the image, write matching alt text, and choose a matching CSS background image. -->
        <img class="machine-art" src="machine.svg" alt="A control panel with a large button and blinking lights" width="640" height="400">
        <section class="result-card" id="result-card" aria-live="polite" hidden>
          <p class="result-label">YOUR NEXT MOVE</p>
          <!-- BUILD LAB EDIT 3: change the labels if they fit your machine better. -->
          <p class="result-line"><span class="result-prefix">Do this:</span> <strong id="action-result">Your action will appear here.</strong></p>
          <p class="result-line"><span class="result-prefix">But:</span> <strong id="complication-result">Your complication will appear here.</strong></p>
        </section>
        <div class="button-row">
          <!-- BUILD LAB EDIT 4: if you change this ID, change the matching onClick ID in script.js. -->
          <button id="chaos-button" type="button">Press the Chaos Button</button>
          <button id="reset-button" class="secondary" type="button">Reset</button>
        </div>
        <p class="machine-note">Every click is a new combination. There are at least 25 possible results.</p>
      </section>
    </main>
    <script src="../../../shared/club-kit.js"></script>
    <script src="script.js"></script>
  </body>
</html>
