<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>Build Lab Showcase Card</title>
    <link rel="stylesheet" href="../shared/club-kit.css">
  </head>
  <body>
    <main class="page-shell">
      <p class="eyebrow">Coding Club · Showcase</p>
      <h1>Our Build Lab project</h1>
      <p class="lede">Use this card to prepare a short, honest explanation of the work your team did.</p>
      <section class="card">
        <form class="stack" onsubmit="return false">
          <label class="field">Team name<input type="text" placeholder="A non-identifying team name"></label>
          <label class="field">Project title<input type="text" placeholder="What should the audience call it?"></label>
          <label class="field">The starter originally…<textarea rows="3" placeholder="Describe what worked before your team changed it."></textarea></label>
          <label class="field">We changed…<textarea rows="3" placeholder="Name one visible change and one code change."></textarea></label>
          <label class="field">Our working feature is…<textarea rows="3" placeholder="What user action causes what response?"></textarea></label>
          <label class="field">One test or bug recovery…<textarea rows="3" placeholder="What did you test, notice, and revise?"></textarea></label>
          <label class="field">Each teammate contributed…<textarea rows="3" placeholder="Name roles and contributions without adding personal data."></textarea></label>
        </form>
      </section>
    </main>
  </body>
</html>
